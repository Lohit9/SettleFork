<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark rounded square background -->
  <rect width="512" height="512" rx="80" fill="#1A2332"/>
  
  <!-- 
    Three cascading bars, centered as a GROUP.
    
    Bar dimensions: 160w × 36h
    Horizontal offset per step: 24px
    Vertical gap between bars: 28px
    
    Group bounding box: 
      Width  = 160 + (2 × 24) = 208
      Height = (3 × 36) + (2 × 28) = 164
    
    Centering:
      X offset = (512 - 208) / 2 = 152
      Y offset = (512 - 164) / 2 = 174
    
    Verification:
      Left padding (to top bar start): 152
      Right padding (from bottom bar end): 512 - (152 + 48 + 160) = 152  ✓
      Top padding: 174
      Bottom padding: 512 - (174 + 164) = 174  ✓
  -->
  
  <!-- Top bar — 30% opacity, leftmost -->
  <rect x="152" y="174" width="160" height="36" rx="12" fill="#FFFFFF" opacity="0.3"/>
  
  <!-- Middle bar — 60% opacity, shifted right 24px -->
  <rect x="176" y="238" width="160" height="36" rx="12" fill="#FFFFFF" opacity="0.6"/>
  
  <!-- Bottom bar — 100% opacity, shifted right 48px -->
  <rect x="200" y="302" width="160" height="36" rx="12" fill="#FFFFFF" opacity="1.0"/>
</svg>
